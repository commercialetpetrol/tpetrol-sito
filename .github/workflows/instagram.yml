name: Aggiorna post Instagram
on:
  push:
    paths: ["instagram_raw.json"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/instagram.py
      - name: Pubblica se cambiati
        run: |
          git add -A ig ig.json
          if ! git diff --cached --quiet; then
            git config user.name "tpetrol-bot"
            git config user.email "tpetrol-bot@users.noreply.github.com"
            git commit -m "Post Instagram aggiornati"
            git pull --rebase
            git push
          fi
